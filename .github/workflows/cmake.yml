name: CMake
on:
  push:
    branches: ["main", "dev"]
jobs:
  cmake:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
            cpack_generator: DEB
          - os: windows-latest
            cc: cl
            cxx: cl
            cpack_generator: NSIS
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
      - name: Install prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential clang cmake libgl1-mesa-dev ninja-build xorg-dev
      - name: Install prerequisites
        if: runner.os == 'Windows'
        run: winget install ninja-build.ninja nsis --accept-source-agreements --disable-interactivity
      - uses: actions/cache@v5
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt','**/CMakePresets.json') }}
          restore-keys: ${{ runner.os }}-cmake-
      - name: CMake configure, build, test
        run: cmake --workflow Debug
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: installer-${{ matrix.os }}
          path: |
            build/*.exe
            build/*.deb
