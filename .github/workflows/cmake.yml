name: CMake Build
on:
  push:
    paths:
      - "**.cpp"
      - "**.c"
      - "**.hpp"
      - "**.h"
      - "**.inl"
      - "**/CMakeLists.txt"
      # pull_request:
      #   paths:
      #     - "**.cpp"
      #     - "**.c"
      #     - "**.hpp"
      #     - "**.h"
      #     - "**.inl"
      #     - "**/CMakeLists.txt"
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake libgl1-mesa-dev ninja-build xorg-dev
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja for Windows
        if: runner.os == 'Windows'
        run: winget install --id Ninja-build.Ninja --accept-source-agreements --disable-interactivity
      - uses: actions/cache@v5
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt','**/CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-cmake-
      - name: CMake configure
        run: |
          cmake -S . -B build -G "Ninja" --preset Release
      - name: CMake build
        run: |
          cmake --build build --preset Release
