name: Build and test
# Every branch but main: work is pushed on a branch, built and tested here, and reaches main only by
# a pull request, which main's protection lets through once this job has passed on the branch's head.
# Not on main itself, because nothing arrives there that has not already run.
on:
  push:
    branches-ignore: ["main"]
jobs:
  # The job keeps its id: main's protection requires the check by the name GitHub makes from it and
  # the matrix, `cmake (windows-latest)`, and a renamed job would leave that check waiting forever.
  cmake:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows only for now. The Linux build has not been checked against the GPU probe octree
        # and the sky, cloud and fog work; put `ubuntu-latest` back here, with its include entry
        # (cc: clang, cxx: clang++), once it has.
        os: [windows-latest]
        include:
          - os: windows-latest
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
      - name: Install prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential clang cmake libgl1-mesa-dev ninja-build xorg-dev
      - name: Install prerequisites
        if: runner.os == 'Windows'
        run: winget install ninja-build.ninja nsis --accept-source-agreements --disable-interactivity
      - uses: actions/cache@v5
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt','**/CMakePresets.json') }}
          restore-keys: ${{ runner.os }}-cmake-
      # Not `cmake --workflow Debug`: the presets leave tests off, and a workflow preset takes no
      # cache overrides, so that ran a test step with nothing registered and passed on a build alone.
      # The steps are the workflow's, with tests turned on at configure.
      - name: Configure
        run: cmake --preset Debug -DKUKI_BUILD_TESTS=ON
      - name: Build
        run: cmake --build --preset Debug
      - name: Test
        run: ctest --preset Debug --output-on-failure
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: installer-${{ matrix.os }}
          path: |
            build/*.exe
            build/*.deb
