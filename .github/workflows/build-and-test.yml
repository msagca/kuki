name: Build and test
# Every branch but main: work is pushed on a branch, built and tested here, and reaches main only by
# a pull request, which main's protection lets through once this job has passed on the branch's head.
# Not on main itself, because nothing arrives there that has not already run.
on:
  push:
    branches-ignore: ["main"]
jobs:
  # The job keeps its id: main's protection requires the check by the name GitHub makes from it and
  # the matrix, `cmake (windows-latest)`, and a renamed job would leave that check waiting forever.
  cmake:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows only for now. The Linux build has not been checked against the GPU probe octree
        # and the sky, cloud and fog work; put `ubuntu-latest` back here, with its include entry
        # (cc: clang, cxx: clang++), once it has.
        os: [windows-latest]
        include:
          - os: windows-latest
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
      - name: Install prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential clang cmake ninja-build xorg-dev
      - name: Install prerequisites
        if: runner.os == 'Windows'
        run: winget install ninja-build.ninja --accept-source-agreements --disable-interactivity
      # The installer's tools only where an installer is made. Installing NSIS on every push was a
      # second download for nothing, and the step it shared failed a run once on winget's exit code
      # alone, after both packages said they had installed.
      - name: Install packaging prerequisites
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        run: winget install nsis --accept-source-agreements --disable-interactivity
      - uses: actions/cache@v5
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt','**/CMakePresets.json') }}
          restore-keys: ${{ runner.os }}-cmake-
      # The `Test` workflow's steps, one to a step so a failure says which. `Test` is `Debug` with
      # the tests on; `Debug` alone builds none, and its workflow runs no test step.
      - name: Configure
        run: cmake --preset Test
      - name: Build
        run: cmake --build --preset Test
      - name: Test
        run: ctest --preset Test
      # A release build, tested again and packaged: the only place the installer is made.
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: cmake --workflow Package
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: installer-${{ matrix.os }}
          path: |
            build/*.exe
            build/*.deb
